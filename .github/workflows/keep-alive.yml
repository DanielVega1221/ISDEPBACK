name: Keep Backend Alive

on:
  schedule:
    # Ejecutar cada 10 minutos (cron syntax: */10 * * * *)
    # Render duerme después de 15 min, así que 10 min es seguro
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "🏓 Pinging ISDEP Backend..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://isdepback.onrender.com/health)
          if [ $response -eq 200 ]; then
            echo "✅ Backend is alive! (HTTP $response)"
          else
            echo "⚠️ Backend responded with HTTP $response"
          fi
      
      - name: Log Timestamp
        run: echo "⏰ Last ping at $(date -u)"
